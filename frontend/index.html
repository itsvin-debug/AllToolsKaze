<!DOCTYPE html>
<html class="light" lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kuro Studio - Multi-Tool Platform</title>
    
    <!-- Google Fonts Inter & Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Outfit:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS with custom Neobrutalist theme -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              background: "#ffffff",
              surface: "#ffffff",
              "on-surface": "#000000",
              "on-surface-variant": "#333333",
              border: "#000000",
              primary: "#000000",
              "on-primary": "#ffffff"
            },
            borderRadius: {
              DEFAULT: "0.5rem",
              sm: "0.25rem",
              md: "0.375rem",
              lg: "0.5rem",
              xl: "0.75rem",
              "2xl": "1rem",
              full: "9999px"
            },
            fontFamily: {
              sans: ["Inter", "-apple-system", "BlinkMacSystemFont", "Segoe UI", "Roboto", "sans-serif"],
              display: ["Outfit", "Inter", "sans-serif"],
              mono: ["JetBrains Mono", "monospace"]
            },
            boxShadow: {
              brutal: "3px 3px 0px #000000",
              "brutal-lg": "5px 5px 0px #000000",
              "brutal-sm": "2px 2px 0px #000000"
            }
          }
        }
      }
    </script>
  </head>
  <body class="bg-white text-black font-sans min-h-screen antialiased selection:bg-black selection:text-white overflow-x-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
